# CD — runs only when commits land on main (i.e. after a PR is merged).
# Deploys the bundle to the prod target as the 'gitbundle' service principal.
# Required GitHub repo secrets:
#   DATABRICKS_CLIENT_ID      application id of the 'gitbundle' service principal
#   DATABRICKS_CLIENT_SECRET  its OAuth secret
name: CD (deploy prod)

on:
  push:
    branches: [main]

defaults:
  run:
    working-directory: dev_platform

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Optional manual gate: create a GitHub Environment named 'prod' with
    # "Required reviewers" to require approval before this job runs.
    environment: prod
    env:
      DATABRICKS_HOST: https://dbc-31b4ebc3-548d.cloud.databricks.com
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Deploy bundle (prod)
        run: databricks bundle deploy -t prod

      # Uncomment to kick off a job/pipeline right after deploy:
      # - name: Run pipeline
      #   run: databricks bundle run <resource_key> -t prod
