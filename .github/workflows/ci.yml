# CI — runs on every Pull Request targeting main.
# Validates the bundle and runs unit tests. Does NOT deploy anything.
# Required GitHub repo secrets (Settings > Secrets and variables > Actions):
#   DATABRICKS_CLIENT_ID      application id of the 'gitbundle' service principal
#   DATABRICKS_CLIENT_SECRET  its OAuth secret
name: CI (validate & test)

on:
  pull_request:
    branches: [main]

# The bundle lives in the dev_platform/ subdirectory, not the repo root.
defaults:
  run:
    working-directory: dev_platform

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: https://dbc-31b4ebc3-548d.cloud.databricks.com
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Transformation tests spin up a local SparkSession, which requires a JDK.
      - name: Install Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install test dependencies (vanilla pyspark, without databricks-connect)
        run: uv sync --only-group test

      - name: Run unit tests
        run: uv run --only-group test pytest

      # Validate against the prod target: it uses service-principal auth (env vars
      # above), so it works in CI where the local 'community' profile is absent.
      - name: Validate bundle (prod)
        run: databricks bundle validate -t prod
