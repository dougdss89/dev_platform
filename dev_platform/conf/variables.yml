# Variable DECLARATIONS (defaults + descriptions).
# Per-environment values are assigned in conf/targets/<env>.yml.
# Merged into the bundle via the `include` globs in databricks.yml.
variables:
  catalog:
    description: The catalog the resources use (set per target)

  raw_schema:
    default: raw
    description: Raw layer where data lands as-is. Don't do any transformation here.

  raw_notebooks:
    default: raw
    description: Raw layer where data lands as-is. Don't do any transformation here.

  raw_data_contract:
    default: raw
    description: Raw layer where data lands as-is. Don't do any transformation here.

  raw_workflows_jobs:
    default: raw
    description: Raw layer where data lands as-is. Don't do any transformation here.

  trusted_schema:
    default: trusted
    description: Trusted layer with cleaned data.

  trusted_notebooks:
    default: trusted
    description: Trusted layer with cleaned data.

  trusted_data_contract:
    default: trusted
    description: Trusted layer with cleaned data.

  trusted_workflows_jobs:
    default: trusted
    description: Trusted layer with cleaned data.

  enriched_schema:
    default: enriched
    description: Enriched layer where data is grouped and measures are created.

  enriched_notebooks:
    default: enriched
    description: Enriched layer where data is grouped and measures are created.

  enriched_data_contract:
    default: enriched
    description: Enriched layer where data is grouped and measures are created.

  enriched_workflows_jobs:
    default: enriched
    description: Enriched layer where data is grouped and measures are created.


  sp_bundle_application_id:
    # Service principals are account-level: this is the one from the prod account/workspace.
    default: 43bd6c8a-108b-4a96-a8af-aea768ab292e
    description: Application (client) ID of the 'sp_databricks_bundle_prd' service principal used for CI/CD deploys.
