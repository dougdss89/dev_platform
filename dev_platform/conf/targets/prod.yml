# Environment: PROD
# Production deployment, driven by CI/CD as the 'sp_databricks_bundle' service principal.
# Prod lives in its OWN workspace/account (dbc-ea2c3f22-c40e, workspace id 7474653833427612);
# dev stays in the original workspace (see dev.yml).
targets:
  prod:
    mode: production

    workspace:
      host: https://dbc-ea2c3f22-c40e.cloud.databricks.com
      # No 'profile' here: prod is deployed via service principal (OAuth M2M env
      # vars DATABRICKS_HOST/DATABRICKS_CLIENT_ID/DATABRICKS_CLIENT_SECRET) in CI.
      # A hardcoded profile would conflict with that auth method.
      # Deploy under the service principal's own workspace folder (CD identity). A local deploy
      # by a human needs workspace-admin rights to write there.
      root_path: /Workspace/Users/${var.sp_bundle_application_id}/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: advworks_prd

    permissions:
      - user_name: saldanha.s.douglas@gmail.com
        level: CAN_MANAGE
      # service_principal_name must be the SP's Application ID (UUID), not its
      # display name "sp_databricks_bundle" — the CLI does not resolve the display name here.
      - service_principal_name: ${var.sp_bundle_application_id}
        level: CAN_MANAGE
