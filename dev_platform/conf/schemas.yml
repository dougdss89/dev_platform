# Unity Catalog schemas provisioned by the bundle (replaces manual CREATE SCHEMA).
# `bundle deploy` creates them in ${var.catalog} for the active target.
#
# CAUTION: the deploy identity needs CREATE SCHEMA on the catalog. In an
# environment where these schemas ALREADY exist (e.g. prod, created manually and
# holding data), a deploy that introduces them as new bundle resources can fail
# with "schema already exists" — adopt them only in a fresh catalog, or reconcile
# first. Safe to roll out in a clean dev catalog.
resources:
  schemas:
    raw_schema:
      catalog_name: ${var.catalog}
      name: ${var.raw_schema}
      comment: "Raw layer — data as landed, ingestion metadata only."
    trusted_schema:
      catalog_name: ${var.catalog}
      name: ${var.trusted_schema}
      comment: "Trusted layer — cleaned, normalized, domain rules applied."
    enriched_schema:
      catalog_name: ${var.catalog}
      name: ${var.enriched_schema}
      comment: "Enriched layer — business aggregates and measures."
