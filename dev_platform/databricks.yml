# This is a Declarative Automation Bundle definition for dev_platform.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: advworks_project
  uuid: 3ef93bb8-a5a0-481f-9f94-ee0e41ae0560

include:
  - resources/*.yml
  - jobs/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog: 
    description: The catalog the resources use (set per target)

  raw_schema:
    default: raw
    description: Raw layer which data in is as-is mode. Dont' do any transformation here. 
    
  bronze_notebooks:
    default: raw
    description: Raw layer which data in is as-is mode. Dont' do any transformation here. 
    
  bronze_data_contract:
    default: raw
    description: Raw layer which data in is as-is mode. Dont' do any transformation here. 

  trusted_schema:
    default: trusted
    description: Trusted layer with cleaning data

  enriched_schema:
    default: enriched
    description: Enriched layer where the data are grouped and measures is created.

  root_path:
    default: /Workspace/Users/egcpdata@gmail.com/.bundle/${bundle.name}/${bundle.target}
    description: Path to the workspace root on Databricks

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true

    workspace:
      host: https://dbc-31b4ebc3-548d.cloud.databricks.com
      profile: community

    variables:
      catalog: advworks_dev
      raw_schema:       
      trusted_schema:   
      enriched_schema:  
  prod:
    mode: production
    workspace:
      host: https://dbc-31b4ebc3-548d.cloud.databricks.com
      profile: community
      # We explicitly deploy to /Workspace/Users/egcpdata@gmail.com to make sure we only have a single copy.
      root_path: ${var.root_path}

    variables:
      catalog: advworks_prd
      raw_schema:          
      trusted_schema:      
      enriched_schema:     


    permissions:
      - user_name: egcpdata@gmail.com
        level: CAN_MANAGE




