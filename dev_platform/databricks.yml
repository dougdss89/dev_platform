# This is a Declarative Automation Bundle definition for dev_platform.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: advworks_project
  uuid: 3ef93bb8-a5a0-481f-9f94-ee0e41ae0560

include:
  - resources/*.yml
  - jobs/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  dev_catalog: advworks
    description: The catalog to use

  prd_catalog: advworks_prd
    description: The schema to use

  prd_schema:
    description: The schema to use

  databricks_host: https://dbc-31b4ebc3-548d.cloud.databricks.com
    description: The schema to use

  root_path: /Workspace/Users/egcpdata@gmail.com/.bundle/${bundle.name}/${bundle.target}
    description: The schema to use

  dev_schema:
    description: The schema to use

  dev_schema:
    description: The schema to use

  dev_schema:
    description: The schema to use

  dev_schema:
    description: The schema to use
  

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true

    workspace:
      host: "${var.databricks_host}"
      profile: community

    variables:
      catalog: "${var.dev_catalog}"
      schema: ${}

  prod:
    mode: production
    workspace:
      host: "${var.databricks_host}"
      profile: community
      # We explicitly deploy to /Workspace/Users/egcpdata@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/egcpdata@gmail.com/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: "${var.prd_catalog}"
      schema: "${var.prd_schema}"
      
    permissions:
      - user_name: egcpdata@gmail.com
        level: CAN_MANAGE
