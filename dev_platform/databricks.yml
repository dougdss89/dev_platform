# Declarative Automation Bundle for advworks_project.
# This file is kept intentionally minimal: identity + build + what to include.
# All other configuration lives in dedicated, single-responsibility files that
# are merged via the `include` globs below.
# Docs: https://docs.databricks.com/dev-tools/bundles/index.html
# yaml-language-server: $schema=.vscode/bundle_config_schema.json

bundle:
  name: advworks_project
  uuid: 3ef93bb8-a5a0-481f-9f94-ee0e41ae0560

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Configuration split across files, merged in this order:
include:
  - conf/variables.yml     # variable declarations (defaults + descriptions)
  - conf/tags.yml          # bundle-wide tags (presets.tags)
  - conf/targets/*.yml     # one file per environment (dev, prod)
  - resources/*.yml        # pipelines, jobs, volumes, dashboards, ...
  - jobs/*.yml
