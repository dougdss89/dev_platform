# Orchestrator — ORDERS the layers (inter-layer) via run_job_task.
# Runs no code of its own: each task simply triggers a layer job and waits.
# The raw -> trusted -> (enriched) order is defined by `depends_on` between tasks.
#   run raw-ingestion
#        │
#        ▼
#   run trusted-build
#
# At the orchestration level, this is the analog of the transformer list inside
# a factory: here we sequence entire jobs rather than individual transformations.
resources:
  jobs:
    customer_orchestrator:
      name: customer_orchestrator
      tasks:
        - task_key: seed
          run_job_task:
            job_id: ${resources.jobs.customer_seed.id}

        - task_key: raw_customer_ingestion
          depends_on:
            - task_key: seed
          run_job_task:
            job_id: ${resources.jobs.raw_customer_ingestion.id}
            
        - task_key: trusted
          depends_on:
            - task_key: raw_customer_ingestion
          run_job_task:
            job_id: ${resources.jobs.trusted_customer_ingestion.id}
