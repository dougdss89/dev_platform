# SEED job — writes small synthetic customer batches to the landing volume on a
# schedule (the "keeps writing" cadence). Promotes with the bundle to dev/prod.
#
# In dev (mode: development) the schedule is auto-paused, so it only runs when you
# trigger it. In prod (mode: production) it runs on the cron below.
# Cost: serverless STANDARD, tiny batch; tune the cron / pause when not training.
resources:
  jobs:
    customer_seed:
      name: customer-seed
      tasks:
        - task_key: seed
          python_wheel_task:
            package_name: dev_platform
            entry_point: seed-customer
            parameters:
              - example   # landing catalog (shared by dev and prod ingestion)
              - "8"       # batch size
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../../dist/*.whl

      schedule:
        quartz_cron_expression: "0 0/30 * * * ?"   # every 30 minutes
        timezone_id: UTC
        pause_status: UNPAUSED

      performance_target: STANDARD
