# SEED job — writes small synthetic customer batches to the landing volume on a
# schedule (the "keeps writing" cadence). Promotes with the bundle to dev/prod.
#
# Schedule ships PAUSED in both dev and prod — trigger the job manually while
# training. Flip pause_status to UNPAUSED when you actually want the 30-min cadence.
# Cost: serverless STANDARD, tiny batch; keep it paused when not training.
resources:
  jobs:
    customer_seed:
      name: customer_seed
      tasks:
        - task_key: seed
          python_wheel_task:
            package_name: dev_platform
            entry_point: seed-customer
            parameters:
              - example   # landing catalog (shared by dev and prod ingestion)
              - "8"       # batch size
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../../dist/*.whl

      schedule:
        quartz_cron_expression: "0 0/30 * * * ?"   # every 30 minutes
        timezone_id: UTC
        pause_status: PAUSED   # training: trigger manually; flip to UNPAUSED only when you want the cadence

      performance_target: STANDARD
