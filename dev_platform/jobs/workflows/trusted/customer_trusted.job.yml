# TRUSTED layer — a single job for all raw -> trusted builds.
# One task per domain, running in parallel (no depends_on between domains).
# To add a new domain, append a task pointing to `<domain>-trusted`.
# Serverless compute; the bundle wheel is included as a dependency.
resources:
  jobs:
    trusted_customer_ingestion:
      name: trusted_customer_ingestion
      tasks:
        - task_key: customer
          python_wheel_task:
            package_name: dev_platform
            entry_point: customer-trusted
            parameters:
              - ${var.catalog}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../../../dist/*.whl
