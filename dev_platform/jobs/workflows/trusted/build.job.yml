# Camada TRUSTED — um job para todo o build raw -> trusted.
# Uma task por domínio, em paralelo (sem depends_on entre domínios).
# Para um domínio novo, acrescente uma task apontando para `<domínio>-trusted`.
# Compute serverless; o wheel do bundle entra como dependency.
resources:
  jobs:
    trusted_build:
      name: trusted-build
      tasks:
        - task_key: customer
          python_wheel_task:
            package_name: dev_platform
            entry_point: customer-trusted
            parameters:
              - ${var.catalog}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../../../dist/*.whl
