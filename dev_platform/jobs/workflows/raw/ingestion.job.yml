# Camada RAW — um job para toda a ingestão landing -> raw.
# Uma task por domínio, SEM depends_on entre elas: domínios são independentes,
# então rodam em paralelo. Para adicionar um domínio novo, acrescente uma task
# aqui apontando para o entry point `<domínio>-ingest`.
# Compute serverless; o wheel do bundle entra como dependency.
resources:
  jobs:
    raw_ingestion:
      name: raw-ingestion
      tasks:
        - task_key: customer
          python_wheel_task:
            package_name: dev_platform
            entry_point: customer-ingest
            parameters:
              - ${var.catalog}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../../../dist/*.whl
