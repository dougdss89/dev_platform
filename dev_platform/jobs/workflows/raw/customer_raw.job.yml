# RAW layer — a single job for all landing -> raw ingestion.
# One task per domain, with NO depends_on between them: domains are independent,
# so they run in parallel. To add a new domain, append a task here pointing to
# the `<domain>-ingest` entry point.
# Serverless compute; the bundle wheel is included as a dependency.
resources:
  jobs:
    raw_customer_ingestion:
      name: raw_customer_ingestion
      tasks:
        - task_key: customer
          python_wheel_task:
            package_name: dev_platform
            entry_point: customer-ingest
            parameters:
              - ${var.catalog}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../../../dist/*.whl
