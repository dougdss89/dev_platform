# The main pipeline for dev_platform

resources:
  pipelines:
    dev_platform_etl:
      name: dev_platform_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/dev_platform_etl"

      libraries:
        - glob:
            include: ../src/dev_platform_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
